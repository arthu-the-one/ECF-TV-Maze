<main>
    <section>
        <h1>Le Meilleur du Streaming</h1>
        <form (submit)="onSubmit($event)">
            <label for="search">Trouvez votre série :</label>
            <input type="text" id="search" [formField]="form.search" />
            <button type="submit">Rechercher</button>
        </form>

        @if (loading()) {
        <p>Chargement...</p>
        }
        @else if (errorMessage()) {
        <p>{{ errorMessage() }}</p>
        }
        @else if (hasSearched()) {
        <section>
            @for (show of shows(); track show.id) {
            <app-card [show]="show" />
            } @empty {
            <p>Aucune série trouvée.</p>
            }
        </section>
        }
    </section>
</main>
