<article>

    <a [routerLink]="['/tv-maze/show', show().id]">
        @if (show().image; as image) {
            <img [src]="image.medium" [alt]="show().name">
        } @else {
            <p>Aucune image disponible</p>
        }
        <h2>{{ show().name }}</h2>
    </a>

    <p>{{ show().status }}</p>

    <p>
        Note : {{ show().rating.average ?? 'Non notée' }}
    </p>

    <button type="button" (click)="toggleFavorite()">
        {{ isFavorite() ? '❤️ Retirer des favoris' : '🤍 Ajouter aux favoris' }}
    </button>
</article>
